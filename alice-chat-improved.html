<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Improved Security & UX</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat { border: 1px solid #ccc; max-width: 600px; margin: auto; padding: 10px; }
        .message { margin: 5px 0; }
        .error { color: red; }
    </style>
</head>
<body>
    <div id="chat">
        <h2>Discord-Inspired Chat</h2>
        <div id="messages"></div>
        <input type="text" id="input" placeholder="Type your message...">
        <button id="send">Send</button>
        <div class="error" id="error"></div>
    </div>
    <script>
        const sendButton = document.getElementById('send');
        const messageInput = document.getElementById('input');
        const messagesDiv = document.getElementById('messages');
        const errorDiv = document.getElementById('error');
        let messageCount = 0;
        const RATE_LIMIT = 5; // Max messages per minute
        const API_ENDPOINT = '/api/chat';

        sendButton.addEventListener('click', () => {
            const message = messageInput.value.trim();
            errorDiv.textContent = '';

            // Input Validation: Check for empty message
            if (!message) {
                errorDiv.textContent = 'Message cannot be empty!';
                return;
            }

            messageInput.value = '';
            sendMessage(message);
        });

        function sendMessage(message) {
            if (messageCount >= RATE_LIMIT) {
                errorDiv.textContent = 'Rate limit exceeded!';
                return;
            }

            messageCount++;
            const sanitizedMessage = sanitize(message);
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.textContent = sanitizedMessage;
            messagesDiv.appendChild(messageElement);

            // Simulate API call
            fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: sanitizedMessage })
            }).then(response => {
                // Handle response
                console.log(response);
            });
        }

        function sanitize(input) {
            const temp = document.createElement('div');
            temp.textContent = input;
            return temp.innerHTML; // Return sanitized HTML
        }

        // Reset message count every minute
        setInterval(() => messageCount = 0, 60000);
    </script>
</body>
</html>
